[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sfugaj-clockdrift"
version = "0.1.0"
description = "按结构键把条目聚类，标出分布式追踪的时钟漂移上的同组项与各组的代表样本"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "sfugaj" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://sfugaj.github.io"
Repository = "https://github.com/sfugaj/clockdrift"
Issues = "https://github.com/sfugaj/clockdrift/issues"

[project.scripts]
clockdrift = "clockdrift:main"

[tool.setuptools]
py-modules = ["clockdrift"]
